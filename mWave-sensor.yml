# Board: Espressif ESP32-S3-DevKitC-1-N16R8V (16 MB Flash Quad, 8 MB PSRAM Octal)
# Definition: definitions/boards/esp32-s3-devkitc1-n16r8/manifest.yaml
# September 2026

esphome:
  name: patio-sensor-1
  friendly_name: Patio Sensor One
  area: Garage
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"

esp32:
  board: esp32-s3-devkitc1-n16r8
  variant: ESP32S3
  framework:
    type: esp-idf
  flash_size: 16MB

psram:
  mode: octal
  speed: 80MHz
  
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret mmwave_sensor__encryption_key

ota:
  - platform: esphome
    password: !secret mmwave_sensor__ap_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: mmWave Sensor Fallback Hotspot
    password: !secret mmwave_sensor__ap_password

  domain: .internal.barefootautomation.com
captive_portal:

time:
  - platform: homeassistant
    id: ha_time

light:
  - platform: esp32_rmt_led_strip
    name: "Patio Sensor OnBoardLED"
    pin: GPIO48
    id: light_esp32_rmt_led_strip_1
    chipset: WS2811
    num_leds: 1
    rgb_order: GRB
    icon: "mdi:led-off"
  
uart:
  - id: radar_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

  # 🛰️ NEW: Second UART Bus for the new LD2410C
  - id: radar_uart_2
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  - id: patio_radar
    uart_id: radar_uart

  # 🛰️ NEW: Second Radar Configuration
  - id: patio_radar_2
    uart_id: radar_uart_2

switch:
  - platform: ld2410
    ld2410_id: patio_radar
    engineering_mode:
      name: "Patio Radar Engineering Mode"
  # 🛰️ NEW: Engineering mode for the second radar
  - platform: ld2410
    ld2410_id: patio_radar_2
    engineering_mode:
      name: "Patio Radar 2 Engineering Mode"

binary_sensor:
  - platform: ld2410
    ld2410_id: patio_radar
    has_target:
      name: "Patio Occupancy (UART)"
    has_moving_target:
      name: "Patio Moving Target"
    has_still_target:
      name: "Patio Still Target"

  # 🛰️ NEW: Binary sensors for the second radar
  - platform: ld2410
    ld2410_id: patio_radar_2
    has_target:
      name: "Patio Occupancy 2 (UART)"
    has_moving_target:
      name: "Patio Moving Target 2"
    has_still_target:
      name: "Patio Still Target 2"
      
  - platform: gpio
    pin: 
      number: GPIO15
      mode: INPUT_PULLDOWN
    name: "Patio Presence (Hardware OUT)"
    device_class: motion
    icon: "mdi:abacus"

sensor:
  - platform: ld2410
    ld2410_id: patio_radar
    moving_distance:
      name: Patio Moving Target Distance
    still_distance:
      name: Patio Still Target Distance

  # 🛰️ NEW: Sensors for the second radar
  - platform: ld2410
    ld2410_id: patio_radar_2
    moving_distance:
      name: Patio Moving Target 2 Distance
    still_distance:
      name: Patio Still Target 2 Distance
# 🎛️ FIX: Added nested gate properties to guarantee visibility in Home Assistant
number:
  - platform: ld2410
    ld2410_id: patio_radar 
    timeout:
      name: "Patio Unmanned Timeout"
    light_threshold:
      name: "Patio Light Threshold"
    max_move_distance_gate: 
      name: "Max Motion Distance Gate"
    max_still_distance_gate:
      name: "Max Still Distance Gate"
    g0:
      move_threshold:
        name: "Patio Gate 0 Move Threshold"
      still_threshold:
        name: "Patio Gate 0 Still Threshold"
    g1:
